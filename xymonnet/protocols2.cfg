# protocols.cfg
#
# $Id$
#
# How xymonnet tests TCP services. See protocols.cfg(5) for the full rules.
#
# An entry is a conversation, and the lines run in the order written:
#
#     [NAME]
#        expect "220" until "220 "     wait for a reply that starts "220",
#        send   "ehlo xymonnet\r\n"     reading on until a line starts "220 "
#        expect "250" until "250 "
#        options banner
#        port 25
#
# expect first waits; send first asks. A server that greets must be waited
# for -- sending into the greeting is a protocol violation in SMTP, and is
# what this file used to do.
#
# [NAME1|NAME2] defines several service names from one entry.
#
# expect  match the start of a reply. Without "until" it takes one line;
#         with it, lines are read until one starts with the terminator.
# send    write it. "\r" "\n" "\t" and "\xNN" are recognised.
# start   "start tls" upgrades the connection where the line sits, after the
#         server has agreed to it.
# start iac
#         negotiate telnet options here. IAC is the telnet protocol's, not
#         port 23's: MUDs and BBSes use it on their own ports
# port    the TCP port, and the only place it comes from -- /etc/services is
#         not consulted. hosts.cfg can override it per host as "NAME:PORT".
# An entry with no send and no expect is a connect check: nothing is asked and
# nothing is matched, so the port opening is the whole of it. That is the only
# thing some protocols here allow -- see the entries that carry no steps.
#
# options one or more of, comma-separated:
#   banner        read the socket once even though no step asks to. Nothing
#                 shipped uses it: an "expect" already reads, and asks for an
#                 answer as well. Still accepted -- older files are full of it
#   ssl           TLS from the first byte. The older spelling of a "start tls"
#                 ahead of every other step, still accepted
#   telnet        the older spelling of "start iac", still accepted: an entry
#                 carrying it is given that step, at the front. As a step it
#                 can also say WHERE the negotiation happens
#   alpn=P1,P2    ALPN protocols to offer during the TLS handshake
#
# A line that cannot be resolved refuses the whole entry: it is reported when
# this file is read, and the entry then sends nothing and reports yellow.
# Reporting green for a check that did not run is the fault being avoided.

# Every service protocols.cfg defines, written as a state machine.
#
# Same services, same ports, same conversations -- said in the form that can
# name what each answer MEANS. A positional entry has one way to fail, so a
# server that is briefly busy and one that is broken share a colour; here each
# alternative carries its own verdict. A service defined in both files is taken
# from this one, because a state machine can say everything the other can.

[ftp]
   port 21
   start greeting

   state greeting
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "quit\r\n"
      expect "221"                 -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[ftps]
   port 990
   start greeting

   state greeting
      start tls
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "quit\r\n"
      expect "221"                 -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[ssh|ssh1|ssh2]
   port 22
   start greeting

   state greeting
      expect "SSH"                 -> success

[telnet]
   # The options come first and share reads with the greeting behind them, so
   # "start iac" takes them off the front and the expect sees the text.
   #
   # The expect is empty because there is nothing to match on: what a telnetd
   # greets with is a local banner, and appliances answer with anything at
   # all. It still asks for one, which "options banner" -- the older spelling,
   # still accepted -- did not: that made the port opening the whole check, so
   # a server accepting connections and never speaking read as healthy with an
   # empty banner column.
   port 23
   start greeting

   state greeting
      start iac
      expect ""                    -> success

[telnets]
   # As [telnet], with the handshake first: "start tls" before any other step
   # is TLS from the first byte, and the options are negotiated inside it.
   port 992
   start greeting

   state greeting
      start tls
      start iac
      expect ""                    -> success

# This entry requires ESMTP: the server has to answer EHLO with 250, not just
# print a banner. That is a deliberate change from checking the greeting
# alone, because the greeting alone cannot see the fault this check exists
# for -- a server that prints "220" and then rejects every session it is
# offered (see #450) is green for the whole outage.
#
# The cost is that a server which answers EHLO with 500 or 502 and speaks
# only HELO now reports down. RFC 5321 3.2 does describe that fallback, and
# this entry cannot express it: choosing between two replies needs branching,
# which the linear form does not have. If you run such a server, copy this
# entry into your own protocols.cfg with "helo" in place of "ehlo" -- and a
# proper EHLO-or-HELO fallback is what the branching work is for.
[smtp]
   port 25
   start greeting

   state greeting
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "ehlo xymonnet\r\n"
      expect "250" until "250 "    -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[smtps]
   # 465. IANA reassigned it away from smtps in the 1990s, which is why this
   # entry had no default for years -- but RFC 8314 (2018) assigned it back,
   # as "submissions", and it is what every mail server implementing implicit
   # TLS listens on.
   port 465
   start greeting

   state greeting
      start tls
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "ehlo xymonnet\r\n"
      expect "250" until "250 "    -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

# Explicit TLS on a plaintext port: the certificate for SMTP on 25 or
# submission on 587 exists only after the upgrade, so it cannot be reached
# without asking for one. Not enabled on [smtp] itself -- a server that does
# not offer STARTTLS would then go red -- so this is a separate test to put
# on the hosts where TLS is expected.
[smtptls]
   # 587, submission -- the same port as [submission|msa], checked with the
   # STARTTLS upgrade the plain entry does not do. Not 25: that is [smtp],
   # where TLS is opportunistic between MTAs rather than expected. Both
   # transcripts behind this entry were recorded from submission servers.
   # RFC 3207 4.2: the client MUST re-issue EHLO over the upgraded connection,
   # and the server discards everything it learned before it. Stopping at the
   # handshake also stops one step short of the point: it proves TLS came up,
   # not that there is still an SMTP server behind it.
   port 587
   start greeting

   state greeting
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "ehlo xymonnet\r\n"
      expect "250" until "250 "    -> farewell
      expect "4"                   -> warning
      expect "5"                   -> fail

   state farewell
      send "starttls\r\n"
      expect "220"                 -> done
      expect "4"                   -> warning
      expect "5"                   -> fail

   state done
      start tls
      send "ehlo xymonnet\r\n"
      expect "250" until "250 "    -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[submission|msa]
   port 587
   start greeting

   state greeting
      expect "220" until "220 "    -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "ehlo xymonnet\r\n"
      expect "250" until "250 "    -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[pop2|pop-2]
   port 109
   start greeting

   state greeting
      expect "+OK"                 -> command
      expect "-ERR"                -> fail

   state command
      send "quit\r\n"
      expect "+OK"                 -> success
      expect "-ERR"                -> fail

[pop|pop3|pop-3]
   port 110
   start greeting

   state greeting
      expect "+OK"                 -> command
      expect "-ERR"                -> fail

   state command
      send "quit\r\n"
      expect "+OK"                 -> success
      expect "-ERR"                -> fail

[pop3s]
   port 995
   start greeting

   state greeting
      start tls
      expect "+OK"                 -> command
      expect "-ERR"                -> fail

   state command
      send "quit\r\n"
      expect "+OK"                 -> success
      expect "-ERR"                -> fail

[imap|imap2|imap4]
   # The tagged line is the one with the result in it. "* BYE" is untagged --
   # the server announcing it is closing -- and it is sent whether LOGOUT
   # succeeded or not, so stopping there accepts a logout that failed.
   # RFC 3501 6.1.3 requires the tagged response to follow.
   port 143
   start greeting

   state greeting
      expect "* OK"                -> command

   state command
      send "ABC123 LOGOUT\r\n"
      expect "* BYE"               -> farewell

   state farewell
      expect "ABC123 OK"           -> success

[imap3]
   # The tagged line is the one with the result in it. "* BYE" is untagged --
   # the server announcing it is closing -- and it is sent whether LOGOUT
   # succeeded or not, so stopping there accepts a logout that failed.
   # RFC 3501 6.1.3 requires the tagged response to follow.
   port 220
   start greeting

   state greeting
      expect "* OK"                -> command

   state command
      send "ABC123 LOGOUT\r\n"
      expect "* BYE"               -> farewell

   state farewell
      expect "ABC123 OK"           -> success

[imaps]
   # The tagged line is the one with the result in it. "* BYE" is untagged --
   # the server announcing it is closing -- and it is sent whether LOGOUT
   # succeeded or not, so stopping there accepts a logout that failed.
   # RFC 3501 6.1.3 requires the tagged response to follow.
   port 993
   start greeting

   state greeting
      start tls
      expect "* OK"                -> command

   state command
      send "ABC123 LOGOUT\r\n"
      expect "* BYE"               -> farewell

   state farewell
      expect "ABC123 OK"           -> success

[nntp]
   # 200 and 201 are both "ready": RFC 3977 uses 201 when posting is
   # prohibited, which is what most public and read-only servers answer with.
   # Matching the prefix takes either; pinning 200 would report a perfectly
   # healthy read-only news server as broken.
   #
   # The prefix also admits 205, which is what a server says on the way OUT.
   # The QUIT below is what separates them: a server that is closing does not
   # answer it with a second 205. "200 or 201 and nothing else" would be
   # better, and this grammar cannot express alternatives.
   port 119
   start greeting

   state greeting
      expect "20"                  -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "quit\r\n"
      expect "205"                 -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[nntps]
   # As [nntp]: the prefix takes 200 and 201, and the reply to QUIT is what
   # tells a ready server from one that is closing.
   port 563
   start greeting

   state greeting
      start tls
      expect "20"                  -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "quit\r\n"
      expect "205"                 -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

[ldap]
   # LDAP never greets: it waits for a BER-encoded bind request, and the
   # reply is length-prefixed binary that a prefix match cannot validate.
   # The port opening is the whole check.
   port 389

[ldaps]
   # As [ldap], with TLS from the first byte -- so the certificate is
   # checked, and nothing else is.
   port 636
   start tls

[rsync]
   port 873
   start greeting

   state greeting
      expect "@RSYNCD"             -> success

[bbd|bb]
   # "bb" is the pre-Xymon name for this port, and still what lib/sendmsg.c
   # looks for when XYMONDPORT is unset. Accepted here so a host listed under
   # either name is tested.
   # Connect-only, and it cannot be more. xymond answers "ping" with
   # "xymond <version>" -- but only after the client half-closes the write
   # side, because it reads a request to EOF before replying. There is no way
   # to say "shut down the write side" here, so an expect would wait for a
   # reply that never comes. (A commented-out "send ping / expect xymond"
   # stood here for years; it does not work, for that reason.)
   port 1984

# The AV scanning daemon from the ClamAV antivirus package
[clamd]
   port 3310
   start greeting

   state greeting
      send "PING\n"
      expect "PONG"                -> success

# SpamAssassin spamd
[spamd]
   port 783
   start greeting

   state greeting
      send "PING SPAMC/Xymon\n"
      expect "SPAMD"               -> success

# From Mark Felder
[svn]
   port 3690
   start greeting

   state greeting
      expect "( success"           -> success

# From http://www.mail-archive.com/whatsup_forum@list.ipswitch.com/msg06678.html
[oratns]
   # The listener answers a ping with a TNS packet: two bytes of length, two of
   # checksum, then the byte saying which kind. The length varies with the
   # message, so that byte never sits at a fixed distance from anything an
   # anchored expect can find -- which is why this entry used to ask only that
   # SOMETHING came back, and reported a wrong service on 1521 as healthy.
   #
   # "at 4" reads it. A ping is answered with REFUSE: there is no session to
   # accept, so declining IS the successful answer, and green is 4. The other
   # kinds a listener may send are yellow rather than red -- they mean it spoke
   # TNS but not what a ping should draw, which is worth seeing and is not
   # worth waking somebody for. Anything else is not a listener.
   port 1521
   start ping

   state ping
      send "\x00\x57\x00\x00\x01\x00\x00\x00\x01\x36\x01\x2C\x00\x00\x08\x00\x7F\xFF\xA3\x0A\x00\x00\x01\x00\x00\x1D\x00\x3A\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x08\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00(CONNECT_DATA=(COMMAND=ping))"
      expect "\x04" at 4           -> success
      expect "\x02" at 4           -> warning
      expect "\x0b" at 4           -> warning
      expect "\x05" at 4           -> warning

[qmtp]
   # QMTP is netstring-framed binary; the client speaks first and the
   # reply is length-prefixed. Not expressible here.
   port 209

# qmail "Quick Mail Queuing Protocol"
[qmqp]
   # As [qmtp].
   port 628

# Advanced Message Queuing Protocol
[amqp]
   port 5672
   start greeting

   state greeting
      send "PING\r\n\r\n"
      expect "AMQP"                -> success

# Advanced Message Queuing Protocol over SSL
[amqps]
   port 5671
   start greeting

   state greeting
      start tls
      send "PING\r\n\r\n\r\n\r\n"
      expect "AMQP"                -> success

# vnc "Virtual Network Computing" - method from bb-vnc.tar.gz
# From Richard Finegold
[vnc|rfb]
   # RFB (Remote Frame Buffer) is the protocol's own name and what
   # /etc/services calls 5900; "vnc" is the common one.
   port 5900
   start greeting

   state greeting
      expect "RFB "                -> success

# CUPS print server. It answers to HTTP requests.
[cupsd|ipp]
   # "ipp" is what IANA and /etc/services call 631; "cupsd" is Xymon's own
   # name for it. Both are accepted so a host may be listed either way.
   port 631
   start greeting

   state greeting
      send "GET /printers\r\n"
      expect "HTTP/1.1 200 OK"     -> success

# AJP (Apache JServ Protocol) 1.3 - sends an AJP "ping" request.
# Ref: http://tomcat.apache.org/connectors-doc/common/ajpv13a.html
# From Charles Goyard
[ajp13]
   port 8009
   start greeting

   state greeting
      send "\x12\x34\x00\x01\x0a"
      expect "\x41\x42\x00\x01\x09" -> success

# Microsoft Terminal Services / Remote Desktop Protocol
# Originally From Chris Wopat (http://www.xymon.com/archive/2010/01/msg00039.html)
# Updated By Rob Steuer for current versions of RDP
[rdp]
	port 3389
   start greeting

   state greeting
      send "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x0b\x00\x00\x00"
      expect "\x03\x00\x00\x13\x0e\xd0\x00\x00\x12\x34" -> success

# NETBIOS Session Service for NT Authentication
[netbios-ssn]
   # NetBIOS session setup is a length-prefixed binary request naming both
   # hosts; the answer cannot be matched by prefix.
	port 139

# Simple Network Paging Protocol (SNPP)
[snpp]
	port 444
   start greeting

   state greeting
      expect "220"                 -> command
      expect "4"                   -> warning
      expect "5"                   -> fail

   state command
      send "quit\r\n"
      expect "221"                 -> success
      expect "4"                   -> warning
      expect "5"                   -> fail

# Internet Relay Chat
[ircd]
   # Recorded from irc.libera.chat and irc.oftc.net, 2026-09-01: every line a
   # server sends begins with ":" and its own name, and the 001 welcome arrives
   # only after several NOTICE lines --
   #
   #   :platinum.libera.chat NOTICE * :*** Checking Ident
   #   :platinum.libera.chat 001 xymonnet :Welcome to the Libera.Chat ...
   #
   # so "001" is not at the start of a line and an expect anchored at one
   # cannot ask for it. What can be asked is that the server answered in the
   # protocol's own line format rather than accepting the connection and
   # saying nothing, which is what this entry checked until now.
   port 6667
   start command

   state command
      send "NICK xymonnet\r\nUSER xymond 0 * :Xymonnet\r\nTIME\r\nVERSION\r\nQUIT\r\n"
      expect ":"                   -> success

[lpd|printer]
   # "printer" is what IANA and /etc/services call 515; "lpd" is Xymon's own
   # name for it.
   #
   # LPD commands are binary-prefixed and per-queue: any request needs a
   # queue name this file does not have.
   port 515
