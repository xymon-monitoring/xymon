# Debian-specific settings for xymonserver.cfg.
#
# This fragment is read last, after the defaults in xymonserver.cfg.  That
# matters: loadenv() expands $VAR while it reads, so the aliases
# xymonserver.cfg builds from these values are already set when this file is
# read.  They are repeated at the end to keep them in sync.
#
# Local overrides belong in a file that sorts after this one, e.g.
# 99-local.cfg.

# Hostname comes from the settings shared by server and client.
include /etc/default/xymon-client
XYMONSERVERHOSTNAME="$CLIENTHOSTNAME"

# The list of servers is generated at service start by
# xymon-server-prepare.sh and xymon-client-prepare.sh.
optional include /var/run/xymon/bbdisp-runtime.cfg

XYMONTMP="/var/lib/xymon/tmp"

# Keep the values derived in xymonserver.cfg in sync with the settings above.
MACHINEDOTS="$XYMONSERVERHOSTNAME"
MACHINEADDR="$XYMONSERVERIP"
BBSERVERHOSTNAME="$XYMONSERVERHOSTNAME"
BBSERVERIP="$XYMONSERVERIP"
BBDISP="$XYMSRV"
BBDISPLAYS="$XYMSERVERS"
BBPAGE="$BBDISP"
BBPAGERS="$BBDISPLAYS"
BBTMP="$XYMONTMP"
