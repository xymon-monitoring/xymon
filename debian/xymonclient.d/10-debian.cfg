# Debian-specific settings for xymonclient.cfg.
#
# This fragment is read last, after the defaults in xymonclient.cfg.  That
# matters: loadenv() expands $VAR while it reads, so the variables
# xymonclient.cfg builds from these values are already set when this file is
# read.  They are repeated at the end to keep them in sync.
#
# Local overrides belong in a file that sorts after this one, e.g.
# 99-local.cfg.

# Server list comes from the settings shared by server and client.
include /etc/default/xymon-client

# The list of servers is generated at service start by
# xymon-server-prepare.sh and xymon-client-prepare.sh.
optional include /var/run/xymon/bbdisp-runtime.cfg

PATH="/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin:/usr/lib/xymon/client/bin"

XYMONTMP="/var/lib/xymon/tmp"
XYMONCLIENTLOGS="/var/log/xymon"

# Keep the values derived in xymonclient.cfg in sync with the settings above.
BBDISP="$XYMSRV"
BBDISPLAYS="$XYMSERVERS"
BBTMP="$XYMONTMP"
BBCLIENTLOGS="$XYMONCLIENTLOGS"
