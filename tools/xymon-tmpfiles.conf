# Packaging-only sample. The generated xymonlaunch.service creates /run/xymon
# itself (RuntimeDirectory=), so a source or standalone install does not need
# this file. It is here for a package that provisions the runtime dir through
# systemd-tmpfiles and ships the SELinux policy the "Z" relabel assumes. It
# names the default /run/xymon; a build with another XYMONRUNDIR edits it.
d /run/xymon 0755 xymon xymon -
Z /run/xymon
