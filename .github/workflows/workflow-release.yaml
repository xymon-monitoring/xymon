name: Release tarball on tag
concurrency: 
  group: workflow-tarball
  cancel-in-progress: false
on:
  push:
    tags:
      - 'rel-*'   # or 'v*' 

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
#---------------------------------------------------
      - name: Compute tag + filenames
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # rel-1.2.3
          NAME="xymon-${TAG#rel-}"          # 1.2.3
          ASSET="${NAME}.tar.gz"      # xymon-1.2.3.tar.gz

          echo "tag=${TAG}"   >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
#---------------------------------------------------
      - name: Check the tagged commit was prepared for this version
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # dorelease.sh sets this line in the prep PR, so a tag on a commit
          # without that PR merged would ship the previous version's number.
          WANT="#define VERSION \"${TAG#rel-}\""
          if ! grep -qxF "$WANT" include/version.h; then
            echo "include/version.h at $TAG does not say: $WANT" >&2
            echo "Tag the merge commit of the prep PR for this version." >&2
            exit 1
          fi
#---------------------------------------------------
      - name: Create tar.gz named after tag (folder == tag)
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ steps.vars.outputs.name }}/"
          git -c tar.umask=0022 archive \
            --format=tar \
            --prefix="${PREFIX}" \
            "${{ steps.vars.outputs.tag }}" \
          | gzip -n -9 > "${{ steps.vars.outputs.asset }}"
#---------------------------------------------------
      - name: Generate sha256 checksum
        shell: bash
        run: |
          set -euo pipefail
          # The tarball is reproducible (git archive of the tag + gzip -n),
          # so a published checksum lets anyone verify a download against
          # a rebuild from the same tag.
          sha256sum "${{ steps.vars.outputs.asset }}" > "${{ steps.vars.outputs.asset }}.sha256"
          cat "${{ steps.vars.outputs.asset }}.sha256"
#---------------------------------------------------
      - name: Create GitHub Release and upload tarball
        # Pinned to a commit SHA (the v3 tag) so a moved/compromised tag can't
        # silently change what runs with our contents:write token. Bump
        # deliberately; the trailing comment tracks the human-readable version.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.vars.outputs.asset }}
            ${{ steps.vars.outputs.asset }}.sha256


#===================================================
  # After the tarball, propose main's next version. include/version.h still
  # names the release, so a build from main would claim to be it
  # (RELEASING.md, "After the release"; #676). A job of its own, so nothing
  # here can touch the release; it only opens a pull request to review. It
  # changes version.h alone -- not dorelease.sh's manual pages, which keep
  # the release's version until the next one.
  post-release-dev:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # gh workflow run: a push made with this token starts no workflow
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
#---------------------------------------------------
      - name: Set include/version.h to the next -dev
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#rel-}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is not a final X.Y.Z release: main keeps its version." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./build/bump-dev.sh "$VERSION"
          if git diff --quiet; then
            echo "main's include/version.h no longer names $VERSION: nothing to bump." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$(sed -n 's/^#define VERSION "\(.*\)"$/\1/p' include/version.h)" >> "$GITHUB_OUTPUT"
#---------------------------------------------------
      - name: Open or update the pull request
        if: steps.bump.outputs.next != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          BRANCH="post-release/$NEXT"
          TITLE="version.h: $NEXT after the $VERSION release"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Recreated from main's tip on every run, as the prep branch is.
          git checkout -B "$BRANCH"
          git commit -q -am "$TITLE"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Opened by \`workflow-release.yaml\` after the $VERSION release: \`include/version.h\` names the release until this merges, so a build from \`main\` would report it. Only that line changes. If the next release is not $NEXT, edit the line here before merging. See RELEASING.md, *After the release*."
          fi
          # A push made with GITHUB_TOKEN starts no workflow: run the checks.
          gh workflow run build.yml --ref "$BRANCH"
          gh workflow run tests.yml --ref "$BRANCH"
          echo "Opened or updated the pull request for $NEXT on \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
#---------------------------------------------------
      - name: Say what to do by hand
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF2'
          ## The version bump after the release failed

          The release itself is not affected. Bump `include/version.h` by hand,
          as RELEASING.md, *After the release*, describes:

          ```
          git fetch origin
          git switch -c post-release/next-dev origin/main
          ./build/bump-dev.sh X.Y.Z      # the version just released
          git commit -am "version.h: X.Y.Z+1-dev after the X.Y.Z release"
          git push origin post-release/next-dev
          gh pr create --base main --head post-release/next-dev --fill
          ```
          EOF2
