name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow checks out and runs pull-request code; the token needs
# nothing beyond reading the repo.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A regression test that blocks (e.g. a configure probe growing an
    # interactive prompt) would otherwise hang the job for the runner's
    # 6-hour ceiling. Build + suite take ~1 minute; 15 is generous.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            variant: server

          - name: client, CT=client
            variant: client
            conftype: client

          - name: client CT=server
            variant: client
            conftype: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libc-ares-dev \
            libldap-dev \
            libpcre2-dev \
            librrd-dev \
            libssl-dev \
            libtirpc-dev \
            rrdtool
          # librrd-dev builds xymond_rrd; the rrdtool CLI is a separate
          # package and is what tests/rrd/inode-netbsd.sh reads the produced
          # RRD back with. Without it that test skipped in the one leg that
          # builds xymond_rrd, so the RRD write path was never verified
          # end to end anywhere in CI.

      - name: Configure (${{ matrix.name }})
        env:
          CONFTYPE: ${{ matrix.conftype }}
        run: |
          USEXYMONPING=y \
          ENABLESSL=y \
          ENABLELDAP=y \
          ENABLELDAPSSL=y \
          XYMONUSER=xymon \
          XYMONTOPDIR=/usr/lib/xymon \
          XYMONVAR=/var/lib/xymon \
          XYMONHOSTURL=/xymon \
          CGIDIR=/usr/lib/xymon/cgi-bin \
          XYMONCGIURL=/xymon-cgi \
          SECURECGIDIR=/usr/lib/xymon/cgi-secure \
          SECUREXYMONCGIURL=/xymon-seccgi \
          HTTPDGID=www-data \
          XYMONLOGDIR=/var/log/xymon \
          XYMONHOSTNAME=localhost \
          XYMONHOSTIP=127.0.0.1 \
          MANROOT=/usr/share/man \
          INSTALLBINDIR=/usr/lib/xymon/server/bin \
          INSTALLETCDIR=/etc/xymon \
          INSTALLWEBDIR=/etc/xymon/web \
          INSTALLEXTDIR=/usr/lib/xymon/server/ext \
          INSTALLTMPDIR=/var/lib/xymon/tmp \
          INSTALLWWWDIR=/var/lib/xymon/www \
          ./configure --${{ matrix.variant }}

      - name: Build
        run: |
          echo "running make with $(nproc) parallel processes"
          make -j$(nproc)

      # Run the regression suite against the binaries this variant just built.
      # Every test runs wherever its inputs exist -- the suite is not filtered by
      # variant. XYMON_VARIANT instead names which variant produced this tree, so
      # the manifest in tests/lib/assert.sh can tell two cases apart that are
      # otherwise the same silent skip: a binary this variant is defined to
      # produce but didn't (a build regression -> fail), and one it never builds
      # (-> a declared skip). E.g. tests/server/xymongrep-filter.sh drives
      # common/xymongrep in the server leg and client/xymongrep in a client leg,
      # and fails in either if that leg stopped producing it. This is the only
      # place in CI the binary tests run at all; the separate no-build lane
      # (tests.yml) covers the source-reading tests independently of the build,
      # so they stay visible when the build is red.
      - name: Run regression tests against the build
        env:
          # CONFTYPE=client builds LOCALCLIENT=yes (configure.client), which adds
          # client/xymond_client -- a different promise than a plain client
          # build, hence its own variant name. Otherwise the build variant
          # (server | client) names the tree.
          XYMON_VARIANT: ${{ matrix.conftype == 'client' && 'localclient' || matrix.variant }}
        run: |
          # This leg builds the full source for its variant, so every applicable
          # test finds the code/binaries it guards. The runner's all-skip exit
          # 77 ("nothing verified") can therefore only mean broken discovery,
          # not a legitimate skip -- map it to a hard failure. Actions has no
          # neutral state, so 77 would otherwise surface as a bare nonzero
          # failure with no explanation. `|| rc=$?` exempts the runner from
          # bash -e so the mapping is reachable.
          rc=0
          ./tests/testsuite || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::testsuite skipped everything (rc=77) -- with full source built this means broken discovery, not a legitimate skip"
            exit 1
          fi
          exit "$rc"

  # The 69 HTML manual pages under docs/manpages/ are generated from the roff
  # sources and committed alongside them, and nothing ever checked that the two
  # agree. They drifted for seven years: the last full regeneration is the
  # 4.3.30 release of September 2019 - all 69 pages still carry its two
  # generation timestamps, one second apart - while the sources changed eleven
  # times since. The pages that did follow were patched by hand, keeping that
  # 2019 footer, and eleven others were simply left behind.
  #
  # That was rational while regenerating cost 69 files: man2html restamped
  # every footer from the clock, so a one-line fix produced a 69-file diff.
  # mandoc is reproducible and makehtml.sh now takes a single page, so the
  # correct gesture is finally cheaper than the wrong one - and this job is
  # what keeps it that way.
  #
  # It fails rather than warns, but it uploads what it generated: a contributor
  # without mandoc downloads the artifact instead of installing anything.
  manpages:
    name: manual pages match their sources
    runs-on: ubuntu-24.04   # pinned: the converter's output is version-sensitive (see #52)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # python3 as well as mandoc: makehtml.sh pipes through
      # build/manpage-html.py. The runner image happens to carry python3, but
      # relying on that leaves the dependency invisible until an image change
      # removes it.
      - name: Install the documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc python3

      - name: Regenerate and compare
        run: |
          set -euo pipefail
          before=$(mktemp -d)
          cp -R docs/manpages/. "$before/"
          ./build/makehtml.sh
          if diff -ru "$before" docs/manpages >/tmp/manpages.diff; then
            echo "docs/manpages is up to date with the roff sources"
            exit 0
          fi
          {
            echo "The HTML under docs/manpages/ is out of date with the man-page"
            echo "sources (the .1/.5/.8 roff files). Update it to match the sources"
            echo "and commit."
            echo
            echo "Out-of-date pages:"
            git status --porcelain -- docs/manpages | sed 's/^/  /'
            echo
            echo "  1. With mandoc + python3, rebuild each changed page's HTML from its source:"
            echo "         build/makehtml.sh common/hosts.cfg.5"
            echo
            echo "  2. Without any toolchain, download the HTML this run already built from"
            echo "     the sources -- this overwrites the stale pages under docs/manpages/:"
            echo "         gh run download $GITHUB_RUN_ID -n manpages-regenerated -D docs/manpages"
            echo "     run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Then commit:  git add docs/manpages && git commit"
            echo
            echo "Diff (first 200 lines):"
            sed -n '1,200p' /tmp/manpages.diff
          } >&2
          echo "::error::docs/manpages is out of date - see the job log and the manpages-regenerated artifact"
          exit 1

      - name: Upload the regenerated pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manpages-regenerated
          path: docs/manpages/
