name: attribution

# AGENTS.md forbids crediting an AI tool in anything that lands here. Stating a
# rule is not enforcing one: several tools append these trailers by default, so
# the failure is silent and the person pushing usually has not seen them. Six
# commits on `main` carry one already, out of 6762 -- a session URL, a
# Co-Authored-By naming a model, an Assisted-By naming Copilot. Nobody typed
# any of them.
#
# This checks the commits a pull request adds, and the pull request's own title
# and body: the places a tool writes on its own. It does not read the lines a
# pull request adds to files. A credit inside a file is something a person put
# there rather than something a tool appended behind them, which is AGENTS.md's
# to answer and not a pattern's -- and reading it took a diff parser larger
# than the rest of this check.
#
# It does not look at history either: those six stay where they are, and
# rewriting merged history to remove metadata would cost far more than it buys.
#
# It also runs on what lands on `main`, which is the one thing a pull request
# check cannot see. Both merge methods write a new commit whose message the
# person merging can type into the merge box, after the last check has run, so
# the only moment it exists is after the merge. That run reports rather than
# blocks -- the commit is already there -- but it names it the minute it lands.

on:
  pull_request:
    # `edited` is not a default activity type, and without it the title and body
    # are checked in a version nobody merges: open clean, wait for the tick, then
    # edit the body. Nothing re-runs and the pass stands.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trailers:
    name: no AI attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # AGENTS.md names four shapes: a Co-Authored-By naming a model or an
      # assistant, a "Generated with ..." line, and a "reviewed by" or a
      # "suggested by" credit. Each is a prefix -- a trailer key, or "Generated
      # with" -- AND a tool name. Both halves are load-bearing: the prefix alone
      # would refuse a human co-author and a line generated by mandoc, the tool
      # name alone would refuse the prose AGENTS.md and CONTRIBUTING.md have to
      # contain. The two prefixes share one vendor list so neither can drift.
      #
      # The session forms are their own alternatives, because for them neither
      # half is there to find: `Agent-Logs-Url` is a key whose value names no
      # tool at all -- it points at a github.com session -- so pairing it with
      # the vendor list would match nothing. It is worth having because it
      # travels with a human co-author on every commit inside a pull request,
      # the agent's own co-author line appearing only in the squashed one.
      #
      # Anchored at the start of a line, and that anchor is what does the work:
      # an emitted trailer opens its line, while prose cites the same strings mid
      # sentence. Measured against every commit message on `main`: six hits in
      # 6762, all six genuine trailers, no prose.
      #
      # The vendor half reads the display name only -- everything up to the `<`.
      # A contributor is not the tool they share an address with, and reading the
      # whole line refused `Co-Authored-By: Jane Doe <jane@openai.com>`.
      #
      # A contributor who shares a *name* with a tool is still refused, and that
      # is a cost, not an impossibility. An allowlist of display names separates
      # them -- `Claude (Code|Opus|Sonnet|Haiku)`, `Cursor( Agent)?` -- at the
      # price of going quiet when a name moves: one built and measured against
      # nine emitted shapes passed five, `Claude 5 <noreply@anthropic.com>` and
      # `Cursor Composer <noreply@cursor.sh>` among them, to spare three human
      # names. A refusal a maintainer reads costs less than a miss nobody sees,
      # in a check that leaves the history it would land in alone. So the
      # refusal stands, and AGENTS.md governs it.
      #
      # The vendor list will lag the market. It is the floor, not the rule, and
      # AGENTS.md governs whatever it misses. Keep every entry able to match on
      # its own -- `ChatGPT` was dropped because `GPT` already covers it, and an
      # entry no line can reach alone is one the table below cannot test.
      # `Assistant` is one because AGENTS.md names one: a trailer crediting an
      # assistant without naming its vendor is the shape the vendors cannot reach.
      PATTERN: '^[[:space:]]*(((Co-Authored-By|Reviewed-by|Suggested-by|Assisted-by|Generated-by):|(🤖 )?Generated with )[^<]*(Claude|Copilot|Codex|GPT|Gemini|Cursor|Devin|Anthropic|OpenAI|Assistant)|Agent-Logs-Url:|Claude-Session:|https://claude[.]ai/code/session)'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commits a pull request adds are read as a revision range, and a
          # shallow clone has no base tip to range from.
          fetch-depth: 0

      - name: The pattern behaves
        run: |
          # The pattern is the whole check, so it is worth more than the code
          # around it. Both defects this workflow was corrected for came from
          # reading rather than running, and tightening one token here silently
          # stops matching what a looser one caught. The table says what the rule
          # means; a change that disagrees with it fails here, not in the wild.
          #
          # Two blocks, and they overlap on purpose. The first is the shapes as
          # tools emit them, kept whole because those are what the rule is for.
          # A line there can name two vendors at once -- `OpenAI Codex Desktop`
          # names two -- so it pins neither: delete either entry and the line
          # still matches on the one left. The second block is the single-vendor
          # lines that pin what the first leaves loose. Between them every
          # alternative has a line that fails when it is deleted, which is the
          # property worth having: 22 alternatives, 22 red.
          fail=0
          chk() {
            if printf '%s\n' "$2" | grep -qiE "$PATTERN"; then g=refuse; else g=pass; fi
            if [ "$g" != "$1" ]; then
              echo "::error::should $1 but did $g: $2"
              fail=1
            fi
          }

          chk refuse 'Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>'
          chk refuse 'Co-authored-by: Cursor <noreply@cursor.sh>'
          chk refuse 'Reviewed-by: Claude Code <noreply@anthropic.com>'
          chk refuse 'Suggested-by: GitHub Copilot <198982749+Copilot@users.noreply.github.com>'
          chk refuse 'Generated-by: OpenAI Codex Desktop 26.803.41515'
          chk refuse 'Assisted-by: Gemini Code Assist'
          chk refuse 'Agent-Logs-Url: https://github.com/OpenRefine/OpenRefine/sessions/4055bc4f-0444'
          chk refuse 'Claude-Session: https://claude.ai/code/session_016y2DnP4kiXgy'
          chk refuse 'https://claude.ai/code/session_016y2DnP4kiXgy'
          chk refuse '🤖 Generated with [Claude Code](https://claude.com/claude-code)'
          chk refuse 'Generated with [Claude Code](https://claude.com/claude-code)'

          # One line per vendor the block above leaves loose, each naming a
          # single tool. The display name is the whole of what the vendor half
          # reads, so no case here can be carried by a second tool name in an
          # address -- which is what `Co-Authored-By: GPT4 <bot@openai.com>`
          # was, refused for the `openai.com` while a `GPT` narrowed to `GPT-`
          # still passed the table having stopped matching what the entry is for.
          chk refuse 'Generated with Claude Code'
          chk refuse 'Co-Authored-By: Claude <bot@example.com>'
          chk refuse 'Reviewed-by: Codex <bot@example.com>'
          chk refuse 'Assisted-by: ChatGPT <bot@example.com>'
          chk refuse 'Co-Authored-By: GPT4 <bot@example.com>'
          chk refuse 'Co-Authored-By: Devin <devin@example.com>'
          chk refuse 'Suggested-by: Anthropic <bot@example.com>'
          chk refuse 'Generated-by: OpenAI <bot@example.com>'
          chk refuse 'Assisted-by: Assistant <bot@example.com>'

          # Indented, so `[[:space:]]*` has to match something: a trailer quoted
          # inside a block is how it arrives. Dropping the class turns this line
          # red and no other.
          chk refuse '    Co-Authored-By: Claude <bot@example.com>'

          chk pass 'Co-Authored-By: Jane Doe <jane@example.com>'
          chk pass 'Co-Authored-By: Jane Doe <jane@openai.com>'
          chk pass 'Reviewed-by: Alice <alice@anthropic.com>'
          chk pass 'Signed-off-by: A Maintainer <maint@example.org>'
          chk pass 'Generated with [mandoc](https://mandoc.bsd.lv/)'
          chk pass 'no `Co-Authored-By` naming a model or an assistant, no "Generated with ..." line'
          chk pass 'The reviewer asked whether Claude had been used here; it had not.'
          chk pass 'a body citing https://claude.ai/code/session mid sentence is discussing the rule'

          [ "$fail" = 0 ] || exit 1
          echo "pattern behaves on all cases"

      - name: Commit messages
        env:
          # The pull request event names the range; a push carries it as the
          # tip before and after, so one expression serves both.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          # A range this cannot resolve -- a stale head after a force-push, an
          # object the checkout does not have -- must stop the job. Left in the
          # for-list, the failure is swallowed: the substitution's status is not
          # the loop's, "bash -e" does not fire, the body never runs, and the step
          # reports "commits clean" having read nothing.
          #
          # An empty BASE is not an empty range either: git reads the omitted side
          # as the checked-out HEAD, and on a merge-ref checkout "..$HEAD" is
          # empty because the merge already contains it. rev-list exits 0 and the
          # step reports clean having read nothing -- the same swallowed failure,
          # one line earlier.
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::the event carried no commit range (base='$BASE' head='$HEAD')"
            exit 1
          fi

          # Two dots, and the harness below is what says so: three dots reads the
          # symmetric difference, so a commit the base branch added -- one of the
          # six already on `main` among them -- comes back as this pull request's
          # and blocks work that is clean. The scan is defined once so the
          # histories below exercise it rather than a copy.
          scan_commits() {   # $1 base, $2 head -- prints a line per commit that hits
            local commits c
            if ! commits=$(git rev-list "$1".."$2"); then
              echo "::error::cannot enumerate the commits in $1..$2" >&2
              return 2
            fi
            for c in $commits; do
              if git log -1 --format='%B' "$c" | grep -qiE "$PATTERN"; then
                git log -1 --format='%h %s' "$c"
                git log -1 --format='%B' "$c" | grep -inE "$PATTERN" | sed 's/^/    /'
              fi
            done
          }

          # A base branch that moves on carrying a trailer of its own, which is
          # the history two dots gets right and three dots does not. Built where
          # nothing this scan reads can see it, and written with printf rather
          # than a heredoc so no line of this file opens with what it forbids.
          t="$RUNNER_TEMP/range" && rm -rf "$t" && mkdir -p "$t"
          git init -q -b main "$t"
          cd "$t"
          git config user.email ci@example.com && git config user.name ci
          printf 'a\n' > f && git add -A && git commit -qm 'base'
          git checkout -qb pr && printf 'b\n' >> f && git add -A
          git commit -qm 'a pull request crediting nobody'
          git checkout -q main && printf 'c\n' >> f && git add -A
          git commit -qm "$(printf 'the base branch moves on\n\nCo-Authored-By: Claude <bot@example.com>\n')"

          bad=0
          # Not `[ -n "$(scan_commits main pr)" ]`: that reads the output and
          # drops the status, so a scan that failed and printed nothing passes
          # for having found nothing.
          if ! clean=$(scan_commits main pr); then
            bad=1
          elif [ -n "$clean" ]; then
            echo "::error::the range blames a pull request for a commit the base branch added"
            printf '%s\n' "$clean"
            bad=1
          fi
          git checkout -q pr
          git commit -q --allow-empty \
            -m "$(printf 'and one it really does add\n\nCo-Authored-By: Claude <bot@example.com>\n')"
          if ! dirty=$(scan_commits main pr); then
            bad=1
          elif [ -z "$dirty" ]; then
            echo "::error::the range does not name a trailer the pull request adds"
            bad=1
          fi
          cd "$GITHUB_WORKSPACE"
          [ "$bad" = 0 ] || exit 1

          if ! hits=$(scan_commits "$BASE" "$HEAD"); then
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "::error::a commit this pull request adds carries an AI attribution trailer"
            printf '%s\n' "$hits"
            echo "::error::AGENTS.md: do not add attribution for an AI tool. Strip the trailer; on a pull request, amend and force-push."
            exit 1
          fi
          echo "commits clean"

      - name: Pull request title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE "$PATTERN"; then
            echo "::error::the pull request title or body carries an AI attribution line"
            printf '%s\n%s\n' "$TITLE" "$BODY" | grep -inE "$PATTERN" | sed 's/^/    /'
            exit 1
          fi
          echo "title and body clean"
